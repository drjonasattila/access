    <path fill="url(#goldWing)" d="M230 567c156 55 296 69 423 41 102-22 186-70 261-146-37 92-105 167-197 218-91 50-204 68-330 53-69-8-139-29-207-62 60 3 125-5 195-25-55-15-104-41-145-79Z"/>
    <path fill="url(#goldWing)" d="M580 498c82-66 181-90 290-72 49 8 95 24 137 48-58 0-107 11-149 33 51 17 91 46 120 86-61-26-122-36-183-31 28 33 48 72 59 116-52-48-108-79-168-93-54-12-103-6-147 18 0-39 14-74 41-105Z"/>
