<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Avicenna bird watermark</title>
  <desc id="desc">Transparent golden bird watermark with a circular field and soft glow.</desc>
  <defs>
    <radialGradient id="fieldGlow" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#ffd985" stop-opacity="0.26"/>
      <stop offset="48%" stop-color="#c9a85b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a85b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldWing" x1="14%" x2="91%" y1="12%" y2="88%">
      <stop offset="0%" stop-color="#ffe7a6" stop-opacity="0.66"/>
      <stop offset="42%" stop-color="#c9a85b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7c5b24" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="softGlow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96 0 1 0 0 0.72 0 0 1 0 0.28 0 0 0 0.48 0" result="goldBlur"/>
      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="600" cy="494" r="382" fill="url(#fieldGlow)"/>
  <circle cx="600" cy="494" r="382" fill="none" stroke="#c9a85b" stroke-opacity="0.34" stroke-width="18"/>
